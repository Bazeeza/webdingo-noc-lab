! =====================================================================
! Routeur2 - routeur de secours (HSRP en attente)
! Les valeurs entre < > sont a remplacer : aucun secret n'est publie.
! =====================================================================
hostname Routeur2
!
track 1 interface GigabitEthernet0/1 line-protocol
!
interface GigabitEthernet0/0
 description Trunk vers Switch (Fa0/24)
 no ip address
 no shutdown
!
interface GigabitEthernet0/0.1
 description VLAN1_LAN
 encapsulation dot1Q 1 native
 ip address 192.168.5.2 255.255.255.0
 ip nat inside
 standby 1 ip 192.168.5.254
 standby 1 priority 100
 standby 1 preempt
 standby 1 track 1 decrement 20
 no shutdown
!
interface GigabitEthernet0/0.2
 description VLAN2_USERS
 encapsulation dot1Q 2
 ip address 192.168.6.2 255.255.255.0
 ip helper-address 192.168.5.50
 ip nat inside
 standby 2 ip 192.168.6.254
 standby 2 priority 100
 standby 2 preempt
 standby 2 track 1 decrement 20
 no shutdown
!
interface GigabitEthernet0/1
 description Internet-Secondaire
 ip address dhcp
 ip nat outside
 no shutdown
!
access-list 1 permit 192.168.5.0 0.0.0.255
access-list 1 permit 192.168.6.0 0.0.0.255
ip nat inside source list 1 interface GigabitEthernet0/1 overload
ip route 0.0.0.0 0.0.0.0 GigabitEthernet0/1
!
access-list 10 permit host 192.168.5.100
snmp-server community <COMMUNAUTE_SNMP> RO 10
snmp-server location Laboratoire-WebDingo
snmp-server contact equipe-reseau@webdingo.ca
snmp-server host 192.168.5.100 version 2c <COMMUNAUTE_SNMP>
snmp-server enable traps
!
line vty 0 4
 password <MOT_DE_PASSE_VTY>
 login
!
end
write memory
