! =====================================================================
! Switch - commutateur de niveau 2
! Les valeurs entre < > sont a remplacer : aucun secret n'est publie.
! =====================================================================
hostname Switch
!
! Ports des serveurs (VLAN 1, LAN interne 192.168.5.0/24)
interface range fa0/2 - 12
 switchport mode access
 switchport access vlan 1
 no shutdown
!
! Ports des postes utilisateurs (VLAN 2, 192.168.6.0/24)
interface range fa0/13 - 22
 switchport mode access
 switchport access vlan 2
 no shutdown
!
interface Fa0/23
 description Trunk vers Routeur1 (Gi0/0)
 switchport mode trunk
 switchport trunk allowed vlan 1,2
 no shutdown
!
interface Fa0/24
 description Trunk vers Routeur2 (Gi0/0)
 switchport mode trunk
 switchport trunk allowed vlan 1,2
 no shutdown
!
! Adresse de gestion du switch (c'est elle que Zabbix interroge en SNMP)
interface vlan 2
 ip address 192.168.6.177 255.255.255.0
 no shutdown
!
! Passerelle = adresse virtuelle HSRP du VLAN 2
ip default-gateway 192.168.6.254
!
! Le relais DHCP du VLAN 2 est fait par les routeurs (ip helper-address) :
! un switch de niveau 2 ne route pas, il ne peut pas relayer le DHCP.
!
access-list 10 permit host 192.168.5.100
snmp-server community <COMMUNAUTE_SNMP> RO 10
snmp-server location Laboratoire-WebDingo
snmp-server contact equipe-reseau@webdingo.ca
snmp-server host 192.168.5.100 version 2c <COMMUNAUTE_SNMP>
snmp-server enable traps snmp linkdown linkup
snmp-server enable traps stpx
snmp-server enable traps mac-notification change
snmp-server enable traps errdisable
mac address-table notification change
!
end
write memory
